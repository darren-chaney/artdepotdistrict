<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Business — Art Depot District</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .biz-hero { height: 440px; background: var(--bg-card); position:relative; overflow:hidden; margin-top:var(--nav-height); }
    .biz-hero img { width:100%;height:100%;object-fit:cover;opacity:0.6; }
    .biz-hero-overlay { position:absolute;inset:0;background:linear-gradient(to top, rgba(15,12,8,1) 0%, rgba(15,12,8,0.2) 60%); }
    .biz-hero-content { position:absolute;bottom:0;left:0;right:0;padding:40px 24px; max-width:var(--max-width);margin:0 auto; }
    .biz-body { display:grid;grid-template-columns:1fr 340px;gap:64px;padding:64px 0; }
    .biz-gallery { display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:40px 0; }
    .biz-gallery img { width:100%;height:200px;object-fit:cover; }
    .biz-info-card { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;position:sticky;top:calc(var(--nav-height) + 20px); }
    .biz-info-row { display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:0.9rem; }
    .biz-info-row:last-child { border-bottom:none; }
    .biz-info-label { font-family:var(--font-ui);font-size:0.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);min-width:72px;padding-top:2px; }
    .biz-info-val { color:var(--text-secondary); }
    @media(max-width:900px){ .biz-body{grid-template-columns:1fr;} .biz-info-card{position:static;} }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div id="pageContent">
  <div style="margin-top:var(--nav-height);padding:120px 0;text-align:center">
    <div class="loading-spinner"></div>
  </div>
</div>

<div id="footer-placeholder"></div>
<div id="chat-placeholder"></div>

<script src="/js/layout.js"></script>
<script src="/js/chat-widget.js"></script>
<script type="module">
  import { getBusinessBySlug } from '/js/app.js';

  const slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { window.location = '/businesses.html'; }

  getBusinessBySlug(slug).then(biz => {
    if (!biz) { window.location = '/businesses.html'; return; }

    document.title = `${biz.name} — Art Depot District`;
    document.getElementById('pageTitle').textContent = `${biz.name} — Art Depot District`;

    const heroImg = biz.heroImage ? `<img src="${biz.heroImage}" alt="${biz.name}">` : '';

    const gallery = biz.gallery?.length
      ? `<div class="biz-gallery">${biz.gallery.slice(0,4).map(src=>`<img src="${src}" alt="${biz.name}">`).join('')}</div>`
      : '';

    const social = biz.socials
      ? Object.entries(biz.socials).filter(([,v])=>v).map(([k,v])=>
          `<a href="${v}" target="_blank" rel="noopener" class="btn btn-ghost" style="padding:8px 16px;font-size:.75rem;margin-right:8px">${k} &rarr;</a>`
        ).join('') : '';

    const hours = biz.hours
      ? `<div class="biz-info-row"><span class="biz-info-label">Hours</span><span class="biz-info-val" style="white-space:pre-line">${biz.hours}</span></div>`
      : '';
    const phone = biz.phone
      ? `<div class="biz-info-row"><span class="biz-info-label">Phone</span><span class="biz-info-val"><a href="tel:${biz.phone}" style="color:var(--accent)">${biz.phone}</a></span></div>`
      : '';
    const website = biz.website
      ? `<div class="biz-info-row"><span class="biz-info-label">Website</span><span class="biz-info-val"><a href="${biz.website}" target="_blank" rel="noopener" style="color:var(--accent)">Visit Website &rarr;</a></span></div>`
      : '';
    const address = biz.address
      ? `<div class="biz-info-row"><span class="biz-info-label">Address</span><span class="biz-info-val">${biz.address}</span></div>`
      : '';

    document.getElementById('pageContent').innerHTML = `
      <div class="biz-hero">
        ${heroImg}
        <div class="biz-hero-overlay"></div>
        <div style="max-width:var(--max-width);margin:0 auto;padding:0 24px;position:relative;z-index:1;height:100%;display:flex;align-items:flex-end;padding-bottom:40px">
          <div>
            <span class="eyebrow">${biz.category || 'District Business'}</span>
            <h1 style="font-size:clamp(2.2rem,5vw,4rem)">${biz.name}</h1>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="biz-body">
          <div>
            <p style="font-size:1.15rem;color:var(--text-secondary);margin-bottom:32px;line-height:1.8">${biz.summary || ''}</p>
            ${biz.description ? `<div style="color:var(--text-secondary);line-height:1.8">${biz.description}</div>` : ''}
            ${gallery}
            ${social ? `<div style="margin-top:32px">${social}</div>` : ''}
            <div style="margin-top:48px;padding-top:32px;border-top:1px solid var(--border)">
              <a href="/businesses.html" class="btn btn-ghost">&larr; All Businesses</a>
            </div>
          </div>

          <aside>
            <div class="biz-info-card">
              <h5 style="margin-bottom:20px">Business Info</h5>
              ${address}${hours}${phone}${website}
              <div class="biz-info-row">
                <span class="biz-info-label">Type</span>
                <span class="biz-info-val">${biz.category || '—'}</span>
              </div>
              ${biz.districtPromo ? `<div style="margin-top:20px;padding:16px;background:var(--accent-dim);border-radius:var(--radius);border:1px solid var(--accent-border)"><p style="font-size:.9rem;color:var(--text-secondary)">${biz.districtPromo}</p></div>` : ''}
            </div>
          </aside>
        </div>
      </div>`;
  });
</script>
</body>
</html>
